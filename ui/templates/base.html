<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FSSAI Food Label Compliance Pre-Screening Service — automated recommendations for packaged food labels." />
    <title>{% block title %}FSSAI Label Compliance Checker{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/style.css" />
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <span class="brand-icon">🛡️</span>
                <span class="brand-text">FSSAI Label Checker</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">New Check</a>
                <a href="/history" class="nav-link">History</a>
                <a href="/docs" class="nav-link" target="_blank">API Docs</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="disclaimer-banner">
                ⚠️ {{ disclaimer }}
            </div>
            <p class="footer-text">FSSAI Label Compliance Pre-Screening Tool v1.0.0 &mdash; For demonstration purposes only.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
